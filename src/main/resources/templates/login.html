<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秒杀系统登录</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            align-items: center;
            background: linear-gradient(135deg, #f8faff 0%, #eef4ff 100%);
            color: #1f2937;
            display: flex;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            padding: 24px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 16px 48px rgba(30, 64, 175, 0.14);
            padding: 42px 36px;
            width: min(100%, 400px);
        }

        h1 {
            color: #1d4ed8;
            font-size: 26px;
            margin: 0;
            text-align: center;
        }

        .subtitle {
            color: #6b7280;
            font-size: 14px;
            margin: 12px 0 32px;
            text-align: center;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            padding: 12px;
            transition: border-color 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        button {
            background: #2563eb;
            border: 0;
            border-radius: 8px;
            color: #ffffff;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin-top: 8px;
            padding: 12px;
            transition: background-color 0.2s, opacity 0.2s;
            width: 100%;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.65;
        }

        .notice {
            color: #6b7280;
            font-size: 13px;
            line-height: 1.6;
            margin: 22px 0 0;
            text-align: center;
        }

        .result {
            border-radius: 8px;
            display: none;
            font-size: 13px;
            line-height: 1.6;
            margin-top: 18px;
            padding: 12px;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .result.success {
            background: #ecfdf5;
            color: #047857;
        }

        .result.error {
            background: #fef2f2;
            color: #b91c1c;
        }
    </style>
</head>
<body>
<main class="login-card" th:attr="data-input-pass-salt=${inputPassSalt}">
    <h1>秒杀系统</h1>
    <p class="subtitle">请使用手机号登录</p>
    <form id="login-form" novalidate>
        <div class="field">
            <label for="mobile">手机号</label>
            <input id="mobile" name="mobile" type="tel" inputmode="numeric" autocomplete="tel" placeholder="请输入手机号" required>
        </div>
        <div class="field">
            <label for="password">密码</label>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
        </div>
        <button id="login-button" type="submit">登录</button>
    </form>
    <div id="result" class="result" role="alert"></div>
    <p class="notice">密码会在浏览器端和服务端分别进行一次 MD5 加密。</p>
</main>
<script src="/js/md5.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
