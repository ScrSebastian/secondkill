<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单详情 - 秒杀系统</title>
    <style>
        * { box-sizing: border-box; }
        body { align-items: center; background: #f4f7fb; color: #1f2937; display: flex; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; justify-content: center; margin: 0; min-height: 100vh; padding: 24px; }
        .card { background: #fff; border: 1px solid #e7edf5; border-radius: 18px; box-shadow: 0 16px 38px rgba(15, 23, 42, .08); max-width: 660px; overflow: hidden; width: 100%; }
        .status-head { background: linear-gradient(135deg, #dcfce7, #f0fdf4); padding: 30px; text-align: center; }
        .status-icon { align-items: center; background: #16a34a; border-radius: 50%; color: #fff; display: inline-flex; font-size: 27px; height: 52px; justify-content: center; width: 52px; }
        h1 { font-size: 25px; margin: 14px 0 6px; }
        .sub { color: #64748b; margin: 0; }
        .content { padding: 28px 32px 32px; }
        .product { align-items: center; border-bottom: 1px solid #eef2f7; display: flex; gap: 18px; padding-bottom: 20px; }
        .product img { background: #f8fafc; border-radius: 10px; height: 86px; object-fit: contain; padding: 6px; width: 86px; }
        .product h2 { font-size: 18px; margin: 0 0 7px; }
        .product p { color: #64748b; font-size: 14px; line-height: 1.6; margin: 0; }
        .order-info { display: grid; gap: 15px; grid-template-columns: 1fr 1fr; padding: 24px 0 8px; }
        .info-item { background: #f8fafc; border-radius: 10px; padding: 13px 15px; }
        .info-label { color: #94a3b8; display: block; font-size: 12px; margin-bottom: 5px; }
        .info-value { color: #334155; font-size: 14px; font-weight: 700; overflow-wrap: anywhere; }
        .price { color: #e11d48; font-size: 20px; }
        .actions { display: flex; gap: 12px; margin-top: 22px; }
        .button { border-radius: 8px; flex: 1; font-size: 15px; font-weight: 700; padding: 12px 16px; text-align: center; text-decoration: none; }
        .button.primary { background: #2563eb; color: #fff; }
        .button.secondary { background: #eff6ff; color: #2563eb; }
        .loading, .error { color: #64748b; padding: 54px 28px; text-align: center; }
        .error strong { color: #be123c; display: block; font-size: 18px; margin-bottom: 10px; }
        .hidden { display: none; }
        @media (max-width: 540px) { .content { padding: 22px; } .order-info { grid-template-columns: 1fr; } .actions { flex-direction: column; } }
    </style>
</head>
<body>
<main class="card">
    <div class="loading" id="loading">正在加载订单详情…</div>

    <div class="error hidden" id="error-panel">
        <strong>订单加载失败</strong>
        <span id="error-message">请稍后重试</span>
        <div class="actions">
            <a class="button secondary" th:href="@{/goods/toList}">返回商品列表</a>
        </div>
    </div>

    <div class="hidden" id="order-content">
        <section class="status-head">
            <div class="status-icon">✓</div>
            <h1>秒杀订单创建成功</h1>
            <p class="sub">请在规定时间内完成支付。</p>
        </section>
        <section class="content">
            <div class="product">
                <img id="goods-image" src="" alt="商品图片">
                <div>
                    <h2 id="goods-name">商品名称</h2>
                    <p id="goods-title">商品标题</p>
                </div>
            </div>
            <div class="order-info">
                <div class="info-item"><span class="info-label">订单编号</span><span class="info-value" id="order-id">-</span></div>
                <div class="info-item"><span class="info-label">订单状态</span><span class="info-value" id="order-status">-</span></div>
                <div class="info-item"><span class="info-label">商品数量</span><span class="info-value" id="goods-count">-</span></div>
                <div class="info-item"><span class="info-label">应付金额</span><span class="info-value price" id="order-price">-</span></div>
                <div class="info-item"><span class="info-label">下单时间</span><span class="info-value" id="create-date">-</span></div>
                <div class="info-item"><span class="info-label">下单渠道</span><span class="info-value" id="order-channel">-</span></div>
            </div>
            <div class="actions">
                <a class="button primary" href="javascript:void(0)">去支付（待实现）</a>
                <a class="button secondary" th:href="@{/goods/toList}">返回商品列表</a>
            </div>
        </section>
    </div>
</main>

<script>
    (function () {
        const statusNames = ['待支付', '已支付', '已发货', '已收货', '已退款', '已完成'];
        const channelNames = {1: 'PC', 2: 'Android', 3: 'iOS'};
        const orderId = new URLSearchParams(window.location.search).get('orderId');

        function showError(message) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('order-content').classList.add('hidden');
            document.getElementById('error-message').textContent = message;
            document.getElementById('error-panel').classList.remove('hidden');
        }

        if (!orderId) {
            showError('缺少订单编号');
            return;
        }

        fetch('/order/detail?orderId=' + encodeURIComponent(orderId))
            .then(function (response) {
                if (!response.ok) {
                    throw new Error('请求失败，请稍后重试');
                }
                return response.json();
            })
            .then(function (result) {
                if (result.code !== 200 || !result.data || !result.data.order || !result.data.goodsVo) {
                    throw new Error(result.message || '订单不存在');
                }

                const order = result.data.order;
                const goods = result.data.goodsVo;
                const price = Number(order.goodsPrice);
                document.getElementById('goods-image').src = goods.goodsImg || '';
                document.getElementById('goods-image').alt = goods.goodsName || '商品图片';
                document.getElementById('goods-name').textContent = goods.goodsName || '商品';
                document.getElementById('goods-title').textContent = goods.goodsTitle || '';
                document.getElementById('order-id').textContent = order.id;
                document.getElementById('order-status').textContent = statusNames[order.status] || '未知状态';
                document.getElementById('goods-count').textContent = order.goodsCount + ' 件';
                document.getElementById('order-price').textContent = Number.isFinite(price) ? '¥' + price.toFixed(2) : '-';
                document.getElementById('create-date').textContent = order.createDate ? order.createDate.replace('T', ' ') : '-';
                document.getElementById('order-channel').textContent = channelNames[order.orderChannel] || '其他';

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('order-content').classList.remove('hidden');
            })
            .catch(function (error) {
                showError(error.message);
            });
    })();
</script>
</body>
</html>
